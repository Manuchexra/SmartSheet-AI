# ============================================
# SmartSheet AI — Development Override
# Ishlatish: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # Development'da ko'proq papkalar ulansin
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./frontend:/app/frontend

    # Environment
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1

    # Development'da stdin ochiq bo'lsin (debugger uchun)
    stdin_open: true
    tty: true