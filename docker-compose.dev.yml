services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend    # ← allaqachon bor edi
      - ./tests:/app/tests
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true