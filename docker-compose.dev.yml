services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./tests:/app/tests
      - ./data:/app/data          # ← YANGI
      - ./alembic:/app/alembic    # ← YANGI
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true