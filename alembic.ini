# ============================================
# Alembic konfiguratsiyasi
# ============================================

[alembic]
# Migratsiya fayllari papkasi
script_location = alembic

# Fayl nomi shabloni (timestamp + slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Vaqt zonasi
timezone = UTC

# prepend_sys_path — loyiha papkasini Python path'ga qo'shadi
prepend_sys_path = .

# Database URL — .env dan o'qiladi (env.py'da)
# Bu yerda bo'sh qoldiramiz, env.py'da settings.database_url ishlatiladi
sqlalchemy.url =

# Logging sozlamalari
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S