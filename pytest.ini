[pytest]
# Test fayllar qayerda
testpaths = tests

# Test fayl nomlari qanday boshlanadi
python_files = test_*.py

# Test klasslari nomi
python_classes = Test*

# Test funksiyalari nomi
python_functions = test_*

# Chiqish formati
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marker'lar (testlarni guruhlash uchun)
markers =
    unit: Unit testlar (tez, mocksiz)
    integration: Integration testlar (modullar orasida)
    api: API endpoint testlari
    excel: Excel testlari
    ai: AI moduli testlari
    slow: Sekin testlar (AIga haqiqiy sorov)